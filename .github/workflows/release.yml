# Genera el instalador MSI y el ZIP portable (x64 y ARM64) y los publica en una release de GitHub.
#
# Se lanza de dos formas:
#  - Subiendo una etiqueta de versión:  git tag v1.2.0 && git push origin v1.2.0
#  - A mano desde Actions > Release > Run workflow, indicando la versión (crea la etiqueta).
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar, sin "v" (p. ej. 1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Obtener versión
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:TAG_NAME
          } else {
            $version = (dotnet msbuild ModoWindows.csproj -getProperty:Version).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo leer la versión de ModoWindows.csproj' }
          }
          $version = $version.Trim().TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            throw "Versión no válida: '$version' (se espera x.y.z)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Comprobar si la release ya existe
        id: release-check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "v$env:VERSION" *> $null
          $exists = $LASTEXITCODE -eq 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Generar MSI y ZIP
        if: steps.release-check.outputs.exists != 'true'
        shell: pwsh
        run: ./build-release.ps1 -Platform x64, arm64 -Version '${{ steps.version.outputs.version }}'

      - name: Publicar release
        if: steps.release-check.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = (Get-ChildItem artifacts/release -File).FullName
          $options = @('--title', "Modo Windows $env:VERSION", '--generate-notes', '--target', $env:GITHUB_SHA)
          # Versiones con sufijo (1.2.0-beta) se marcan como preliminares.
          if ($env:VERSION -match '-') { $options += '--prerelease' }
          gh release create "v$env:VERSION" @files @options
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear la release' }
